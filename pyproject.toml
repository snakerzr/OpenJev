[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.1.0"
description = "OpenJev Decisions API — System One typed inference (0 output tokens)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=0.34.0",
    "pydantic>=2.9.0",
]

[project.scripts]
openjev = "openjev.cli:main"

[dependency-groups]
benchmark = [
    "httpx>=0.27.0",
]

[tool.uv]
package = true

# Официальные CUDA-сборки PyTorch (Windows/Linux). На macOS lock подтянет CPU wheel с PyPI.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
# На Windows/Linux — свежая CUDA-сборка с pytorch.org; на macOS остаётся PyPI (CPU/MPS).
torch = { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }

[tool.setuptools.packages.find]
include = ["openjev*"]
