[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openjev"
version = "0.2.0"
description = "OpenJev Decisions API — lightweight vLLM gateway for System One typed inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "transformers>=4.45.0",
]

[project.scripts]
openjev = "openjev.cli:main"

[dependency-groups]
benchmark = [
    "httpx>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["openjev*"]
